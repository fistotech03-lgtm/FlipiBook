# Docker Compose configuration for TESTING (https://testing.flipibook.com)
services:
  frontend:
    build:
      context: ./Frontend
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://testing.flipibook.com}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    expose:
      - "80"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://testing.flipibook.com}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - testing-internal
      - dokploy-network

  backend:
    build: ./Backend
    expose:
      - "8000"
      - "5001"
    volumes:
      - /home/flipibook/storage/testing:/app/storage
    environment:
      - MONGO_URI=${MONGO_URI}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@flipibook.com}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-FlipiBook}
      - CLIENT_URL=${CLIENT_URL:-https://testing.flipibook.com}
      - GATEWAY_PORT=${GATEWAY_PORT:-8000}
      - AUTH_PORT=${AUTH_PORT:-5001}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-5001}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:5001}
      - MYFLIPIBOOK_PORT=${MYFLIPIBOOK_PORT:-5002}
      - MYFLIPIBOOK_SERVICE_URL=${MYFLIPIBOOK_SERVICE_URL:-http://localhost:5002}
      - PAGE_EDITOR_PORT=${PAGE_EDITOR_PORT:-5003}
      - PAGE_EDITOR_SERVICE_URL=${PAGE_EDITOR_SERVICE_URL:-http://localhost:5003}
      - PDF_EDITOR_PORT=${PDF_EDITOR_PORT:-5004}
      - PDF_EDITOR_SERVICE_URL=${PDF_EDITOR_SERVICE_URL:-http://localhost:5004}
      - CUSTOMIZED_EDITOR_PORT=${CUSTOMIZED_EDITOR_PORT:-5005}
      - CUSTOMIZED_EDITOR_SERVICE_URL=${CUSTOMIZED_EDITOR_SERVICE_URL:-http://localhost:5005}
      - THREED_EDITOR_PORT=${THREED_EDITOR_PORT:-5006}
      - THREED_EDITOR_SERVICE_URL=${THREED_EDITOR_SERVICE_URL:-http://localhost:5006}
      - PAYMENT_PORT=${PAYMENT_PORT:-5007}
      - PAYMENT_SERVICE_PORT=${PAYMENT_SERVICE_PORT:-5007}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:-http://localhost:5007}
      - APP_PORT=${APP_PORT:-5008}
      - APP_SERVICE_PORT=${APP_SERVICE_PORT:-5008}
      - APP_SERVICE_URL=${APP_SERVICE_URL:-http://localhost:5008}
      - ADMIN_USER_PORT=${ADMIN_USER_PORT:-5009}
      - ADMIN_USER_SERVICE_PORT=${ADMIN_USER_SERVICE_PORT:-5009}
      - ADMIN_USER_SERVICE_URL=${ADMIN_USER_SERVICE_URL:-http://localhost:5009}
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY}
      - RSA_PUBLIC_KEY=${RSA_PUBLIC_KEY}
      - STORAGE_PATH=/app/storage
      - REDIS_URL=${REDIS_URL:-redis://default:Flipibook123@flipibook-redis-vatxsj:6379}
      - TRANSLATION_SERVICE_URL=${TRANSLATION_SERVICE_URL:-http://flipibook-translate:8010/translate/page}
    env_file:
      - path: ./Backend/.env
        required: false
      - path: ./.env
        required: false
    networks:
      testing-internal:
        aliases:
          - backend-gateway
          - backend
      dokploy-network:
        aliases:
          - testing-backend-gateway

networks:
  testing-internal:
    driver: bridge
  dokploy-network:
    name: dokploy-network
    external: true
