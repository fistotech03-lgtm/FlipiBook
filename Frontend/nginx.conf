server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads for PDFs, office docs, and flipbook page packages (up to 250MB)
    client_max_body_size 250M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;

    # Enable Gzip compression for fast transfer
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/xml+rss 
        application/atom+xml 
        image/svg+xml;

    # Use Docker embedded DNS resolver with runtime upstream variables
    # This prevents Nginx from crashing on container startup in standalone preview deployments
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_gateway http://backend-gateway:8000;

    # Proxy API calls directly to Backend Gateway (^~ stops regex matching)
    location ^~ /api/ {
        client_max_body_size 250M;
        proxy_pass $backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        # Disable request buffering to stream large uploads directly to backend
        proxy_request_buffering off;

        # Support longer processing times for heavy PDF/Office conversions
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy storage calls directly to Backend Gateway (^~ stops regex matching)
    location ^~ /storage/ {
        client_max_body_size 250M;
        proxy_pass $backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy legacy uploads calls directly to Backend Gateway (^~ stops regex matching)
    location ^~ /uploads/ {
        client_max_body_size 250M;
        proxy_pass $backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Long-term browser caching strictly for Vite's built bundle assets in /assets/
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry point - ensure index.html is never cached so users always get newest bundle hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA routing fallback for React Router
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
