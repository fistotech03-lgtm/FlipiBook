# Docker Compose configuration for MAIN / PRODUCTION (https://flipibook.com)
services:
  frontend:
    build:
      context: ./Frontend
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://flipibook.com}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    expose:
      - "80"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://flipibook.com}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - main-internal
      - dokploy-network

  backend:
    build: ./Backend
    expose:
      - "8000"
      - "5001"
    volumes:
      - /home/flipibook/storage/production:/app/storage
    environment:
      - MONGO_URI=${MONGO_URI}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - CLIENT_URL=${CLIENT_URL:-https://flipibook.com}
      - GATEWAY_PORT=${GATEWAY_PORT:-8000}
      - AUTH_PORT=${AUTH_PORT:-5001}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-5001}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:5001}
      - MYFLIPIBOOK_PORT=${MYFLIPIBOOK_PORT:-5002}
      - MYFLIPIBOOK_SERVICE_URL=${MYFLIPIBOOK_SERVICE_URL:-http://localhost:5002}
      - PAGE_EDITOR_PORT=${PAGE_EDITOR_PORT:-5003}
      - PAGE_EDITOR_SERVICE_URL=${PAGE_EDITOR_SERVICE_URL:-http://localhost:5003}
      - PDF_EDITOR_PORT=${PDF_EDITOR_PORT:-5004}
      - PDF_EDITOR_SERVICE_URL=${PDF_EDITOR_SERVICE_URL:-http://localhost:5004}
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY}
      - RSA_PUBLIC_KEY=${RSA_PUBLIC_KEY}
      - STORAGE_PATH=/app/storage
    env_file:
      - path: ./Backend/.env
        required: false
      - path: ./.env
        required: false
    networks:
      main-internal:
        aliases:
          - backend-gateway
          - backend

networks:
  main-internal:
    driver: bridge
  dokploy-network:
    name: dokploy-network
    external: true
