server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads for PDFs, office docs, and flipbook page packages (up to 250MB)
    client_max_body_size 250M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;

    # Enable Gzip compression for fast transfer
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/xml+rss 
        application/atom+xml 
        image/svg+xml;

    # Long-term browser caching for static assets (JS, CSS, images, fonts)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls directly to Backend Gateway
    location /api/ {
        client_max_body_size 250M;
        proxy_pass http://backend-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        # Disable request buffering to stream large uploads directly to backend
        proxy_request_buffering off;

        # Support longer processing times for heavy PDF/Office conversions
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy storage and uploads to Backend Gateway
    location ~ ^/(storage|uploads)/ {
        client_max_body_size 250M;
        proxy_pass http://backend-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy storage asset calls to Backend Gateway
    location /storage/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
