# Docker Compose configuration for TESTING (https://testing.flipibook.com)
services:
  frontend:
    build:
      context: ./Frontend
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://testing.flipibook.com}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    expose:
      - "80"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://testing.flipibook.com}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - testing-internal
      - dokploy-network

  backend:
    build: ./Backend
    expose:
      - "8000"
      - "5001"
    volumes:
      - /home/flipibook/storage/testing:/app/storage
    environment:
      - MONGO_URI=${MONGO_URI}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - CLIENT_URL=${CLIENT_URL:-https://testing.flipibook.com}
      - GATEWAY_PORT=${GATEWAY_PORT:-8000}
      - AUTH_PORT=${AUTH_PORT:-5001}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-5001}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:5001}
      - MYFLIPIBOOK_PORT=${MYFLIPIBOOK_PORT:-5002}
      - MYFLIPIBOOK_SERVICE_URL=${MYFLIPIBOOK_SERVICE_URL:-http://localhost:5002}
      - PAGE_EDITOR_PORT=${PAGE_EDITOR_PORT:-5003}
      - PAGE_EDITOR_SERVICE_URL=${PAGE_EDITOR_SERVICE_URL:-http://localhost:5003}
      - PDF_EDITOR_PORT=${PDF_EDITOR_PORT:-5004}
      - PDF_EDITOR_SERVICE_URL=${PDF_EDITOR_SERVICE_URL:-http://localhost:5004}
      - CUSTOMIZED_EDITOR_PORT=${CUSTOMIZED_EDITOR_PORT:-5005}
      - CUSTOMIZED_EDITOR_SERVICE_URL=${CUSTOMIZED_EDITOR_SERVICE_URL:-http://localhost:5005}
      - THREED_EDITOR_PORT=${THREED_EDITOR_PORT:-5006}
      - THREED_EDITOR_SERVICE_URL=${THREED_EDITOR_SERVICE_URL:-http://localhost:5006}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT:-5008}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://localhost:5008}
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY}
      - RSA_PUBLIC_KEY=${RSA_PUBLIC_KEY}
      - STORAGE_PATH=/app/storage
    env_file:
      - path: ./Backend/.env
        required: false
      - path: ./.env
        required: false
    networks:
      testing-internal:
        aliases:
          - backend-gateway
          - backend
      dokploy-network:
        aliases:
          - testing-backend-gateway

networks:
  testing-internal:
    driver: bridge
  dokploy-network:
    name: dokploy-network
    external: true
