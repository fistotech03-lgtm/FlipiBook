# Docker Compose configuration for TESTING (https://testing.flipibook.com)
services:
  frontend:
    build:
      context: ./Frontend
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://testing.flipibook.com}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    expose:
      - "80"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://testing.flipibook.com}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - testing-internal
      - dokploy-network

  backend:
    build: ./Backend
    expose:
      - "8000"
      - "5001"
    environment:
      - MONGO_URI=${MONGO_URI}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - CLIENT_URL=${CLIENT_URL:-https://testing.flipibook.com}
      - GATEWAY_PORT=${GATEWAY_PORT:-8000}
      - AUTH_PORT=${AUTH_PORT:-5001}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-5001}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:5001}
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY}
      - RSA_PUBLIC_KEY=${RSA_PUBLIC_KEY}
    env_file:
      - path: ./Backend/.env
        required: false
      - path: ./.env
        required: false
    networks:
      - testing-internal
      - dokploy-network

networks:
  testing-internal:
    driver: bridge
  dokploy-network:
    name: dokploy-network
    external: true
